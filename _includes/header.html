<header class="site-header">

  <div class="site-header-inner">
    <a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>

    <nav class="site-nav" aria-label="Primary navigation">
      <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="site-nav-panel">
        <span class="nav-toggle-mark" aria-hidden="true"></span>
      </button>

      <div class="trigger" id="site-nav-panel">
        <div class="nav-panel-inner">
          <div class="nav-direct-links">
            <a class="page-link" data-nav-section="about" href="{{ "/#about" | relative_url }}"><span class="page-link-label">About</span></a>
            <a class="page-link" data-nav-section="posts" href="{{ "/#posts" | relative_url }}"><span class="page-link-label">Posts</span></a>
            <a class="page-link" data-nav-route="playlists" href="{{ "/playlists.html/" | relative_url }}"><span class="page-link-label">Playlists</span></a>
            <a class="page-link" data-nav-route="work" href="{{ "/work/" | relative_url }}"><span class="page-link-label">My Work</span></a>
          </div>

          <a class="page-link page-link-subdued page-link-personal" data-nav-route="personal" href="{{ "/personal/" | relative_url }}"><span class="page-link-label">Personal Space</span></a>

          <button class="theme-toggle" type="button" data-theme-toggle data-theme="system" aria-label="Theme: System. Activate to switch to light mode." title="Theme: System. Activate to switch to light mode.">
            <span class="theme-toggle-icon" aria-hidden="true">
              <svg data-theme-icon="system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter"><rect x="3.5" y="4" width="17" height="12" rx="0"/><path d="M8 20h8M12 16v4"/></svg>
              <svg data-theme-icon="light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M4.93 4.93l2.12 2.12M16.95 16.95l2.12 2.12M2 12h3M19 12h3M4.93 19.07l2.12-2.12M16.95 7.05l2.12-2.12"/></svg>
              <svg data-theme-icon="dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter"><path d="M20 15.2A8.5 8.5 0 0 1 8.8 4 8.5 8.5 0 1 0 20 15.2Z"/></svg>
            </span>
          </button>

        </div>
      </div>
    </nav>
  </div>
</header>
