<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicago 'L' Live Art</title>
    <link rel="preload" href="/assets/fonts/archivo-black-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/familjen-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/assets/css/fonts.css">
    <script>
      window.CTA_LIVE_ART_CONFIG = {
        apiUrl: "https://cta-l-live-art.matthewfeil.workers.dev/api/trains",
        sampleUrl: "/assets/cta-l-live-art/sample-snapshot.json",
        homeUrl: "/"
      };
    </script>
    <script>
      (() => {
        const config = window.CTA_LIVE_ART_CONFIG ?? {};
        const liveApiUrl = config.apiUrl ? new URL(config.apiUrl, window.location.href).toString() : null;
        const originalFetch = window.fetch.bind(window);
        let usageUnavailable = false;

        const usageResponse = () => new Response(JSON.stringify({
          error: "daily_usage_unavailable",
          detail: "Page unavailable due to higher usage than expected. Try again the next day."
        }), {
          status: 429,
          headers: { "Content-Type": "application/json" }
        });

        const isLiveApiRequest = (resource) => {
          if (!liveApiUrl) return false;
          const requestUrl = typeof resource === "string" || resource instanceof URL ? resource : resource?.url;
          if (!requestUrl) return false;
          return new URL(requestUrl, window.location.href).toString() === liveApiUrl;
        };

        const isUsageExhaustedMessage = (text) => {
          const normalized = String(text).toLowerCase();
          return normalized.includes("usage")
            && (normalized.includes("daily") || normalized.includes("today"))
            && (
              normalized.includes("used")
              || normalized.includes("limit")
              || normalized.includes("quota")
              || normalized.includes("exceeded")
            );
        };

        const markUsageUnavailable = () => {
          usageUnavailable = true;
          const applyClass = () => document.body?.classList.add("cta-usage-unavailable");

          if (document.body) {
            applyClass();
            return;
          }

          document.addEventListener("DOMContentLoaded", applyClass, { once: true });
        };

        window.fetch = async (resource, init) => {
          const isLiveRequest = isLiveApiRequest(resource);
          if (usageUnavailable && isLiveRequest) {
            return usageResponse();
          }

          const response = await originalFetch(resource, init);
          if (!isLiveRequest) {
            return response;
          }

          const text = await response.clone().text().catch(() => "");
          if (isUsageExhaustedMessage(text)) {
            markUsageUnavailable();
            return usageResponse();
          }

          return response;
        };
      })();
    </script>
    <script type="module" crossorigin src="/assets/cta-l-live-art/index-zoom-gestures.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/cta-l-live-art/index-DD-OmGjU.css">
    <style>
      :root {
        --font-display: "Archivo Black", Impact, sans-serif;
        --font-ui: "Familjen Grotesk", Arial, sans-serif;
        --font-body: "Familjen Grotesk", Arial, sans-serif;
        font-family: var(--font-body);
      }

      html,
      body {
        overscroll-behavior: none;
      }

      body {
        font-family: var(--font-body);
      }

      .train-canvas {
        overscroll-behavior: contain;
      }

      h1,
      h2,
      h3,
      h4 {
        font-family: var(--font-display);
      }

      button,
      label,
      .status-pill {
        font-family: var(--font-ui);
      }

      .site-home-link {
        font-weight: 800;
      }

      button:focus-visible,
      input:focus-visible {
        outline: 2px solid #e3262e;
        outline-offset: 2px;
      }

      button,
      .status-pill,
      .settings-panel,
      .toggle-chip,
      .line-toggle,
      .pause-banner,
      .mono-color-row input {
        border-radius: 0;
      }

      .settings-panel {
        background: #141414;
        box-shadow: -5px 0 0 rgba(255, 255, 255, 0.12);
        opacity: 1;
        transition: transform 260ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .visual-stage:has(.settings-panel.is-open) .top-rail,
      .visual-stage:has(.settings-panel.is-open) .system-note,
      .visual-stage:has(.settings-panel.is-open) .train-canvas {
        transition: none !important;
      }

      .rail-actions > .status-pill,
      .rail-actions > button {
        box-sizing: border-box;
        height: 2.5rem;
        min-height: 2.5rem;
      }

      .settings-info {
        display: grid;
        min-inline-size: 0;
        gap: 0.65rem;
        margin-top: 1rem;
        border-top: 1px solid currentColor;
        color: inherit;
        padding-top: 0.85rem;
      }

      .settings-info h3 {
        margin: 0;
        font-family: var(--font-ui);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.07em;
        line-height: 1.2;
        text-transform: uppercase;
      }

      .settings-info ul {
        display: grid;
        gap: 0.65rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .settings-info li {
        position: relative;
        line-height: 1.4;
        overflow-wrap: anywhere;
        padding-left: 1rem;
      }

      .settings-info li::before {
        position: absolute;
        top: 0.5em;
        left: 0;
        width: 0.4rem;
        height: 0.4rem;
        background: currentColor;
        content: "";
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .usage-banner {
        display: none;
      }

      .pause-banner {
        top: auto;
        bottom: max(0.72rem, env(safe-area-inset-bottom));
        box-shadow: 5px 5px 0 rgba(255, 255, 255, 0.14);
      }

      body.cta-usage-unavailable .usage-banner {
        display: flex;
      }

      body.cta-usage-unavailable .train-canvas {
        filter: grayscale(1);
        opacity: 0.34;
        transition: filter 180ms cubic-bezier(0.25, 1, 0.5, 1), opacity 180ms cubic-bezier(0.25, 1, 0.5, 1);
      }

      body.cta-usage-unavailable .system-note {
        display: none;
      }

      @media (max-width: 720px) {
        button,
        .status-pill {
          min-height: 2.75rem;
        }

        .pause-banner {
          top: auto;
          bottom: max(0.58rem, env(safe-area-inset-bottom));
        }

        .rail-actions > .status-pill,
        .rail-actions > button {
          height: 2.75rem;
          min-height: 2.75rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .settings-panel,
        .system-note,
        .pause-banner,
        .train-canvas {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="pause-banner usage-banner" role="status" aria-live="polite">
      Page unavailable due to higher usage than expected. Try again the next day.
    </div>
    <div id="root"></div>
    <script>
      (() => {
        const root = document.getElementById("root");

        const addSettingsExplanation = () => {
          const panel = document.querySelector("#settings-panel");
          const lineFilter = panel?.querySelector(".line-filter");
          if (!lineFilter || panel.querySelector(".settings-info")) return Boolean(lineFilter);

          const information = document.createElement("section");
          information.className = "settings-info";
          information.setAttribute("aria-labelledby", "settings-info-title");

          const heading = document.createElement("h3");
          heading.id = "settings-info-title";
          heading.textContent = "How it works";

          const list = document.createElement("ul");
          [
            "Live CTA Train Tracker positions are placed on a grid using each train’s latitude and longitude.",
            "Each square is one train, and its color matches the CTA line it is on.",
            "Pulses and blinks suggest a moving train’s direction; when trains share a square, their colors can alternate.",
            "These settings change the artwork’s presentation, while the live train data stays the same."
          ].forEach((item) => {
            const listItem = document.createElement("li");
            listItem.textContent = item;
            list.append(listItem);
          });

          information.append(heading, list);
          lineFilter.insertAdjacentElement("afterend", information);
          return true;
        };

        const enhanceSettingsFocus = () => {
          const panel = document.querySelector("#settings-panel");
          const trigger = document.querySelector('.rail-actions button[aria-controls="settings-panel"]');
          const closeButton = panel?.querySelector(".settings-close");
          if (!panel || !trigger || !closeButton) return;

          const returnFocus = () => window.requestAnimationFrame(() => trigger.focus());
          if (!trigger.dataset.focusEnhanced) {
            trigger.dataset.focusEnhanced = "true";
            trigger.addEventListener("click", () => {
              window.requestAnimationFrame(() => {
                if (trigger.getAttribute("aria-expanded") === "true") closeButton.focus();
              });
            });
          }

          if (!closeButton.dataset.focusEnhanced) {
            closeButton.dataset.focusEnhanced = "true";
            closeButton.addEventListener("click", returnFocus);
          }

          if (!document.documentElement.dataset.settingsEscapeEnhanced) {
            document.documentElement.dataset.settingsEscapeEnhanced = "true";
            document.addEventListener("keydown", (event) => {
              if (event.key !== "Escape" || !panel.classList.contains("is-open")) return;
              event.preventDefault();
              trigger.click();
              returnFocus();
            });
          }
        };

        const updateCanvasDescription = () => {
          const canvas = document.querySelector(".train-canvas");
          if (!canvas) return;

          let summary = document.getElementById("cta-live-summary");
          if (!summary) {
            summary = document.createElement("p");
            summary.id = "cta-live-summary";
            summary.className = "visually-hidden";
            root.insertAdjacentElement("afterend", summary);
          }

          const status = document.querySelector(".rail-title p")?.textContent?.trim();
          summary.textContent = status
            ? `Live CTA Art: ${status}. Each pixel represents a train; colors identify its CTA line.`
            : "Live CTA Art. Each pixel represents a train; colors identify its CTA line.";
          canvas.setAttribute("aria-describedby", summary.id);
        };

        const enhancePage = () => {
          addSettingsExplanation();
          enhanceSettingsFocus();
          updateCanvasDescription();
        };

        enhancePage();

        const observer = new MutationObserver(enhancePage);
        observer.observe(root, { childList: true, characterData: true, subtree: true });
      })();
    </script>
  </body>
</html>
