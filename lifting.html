<section
  class="lifting-app"
  data-api-url="https://ofrbbmkbbtohocgifwly.functions.supabase.co/lifting-api"
  data-personal-url="{{ "/personal/" | relative_url }}"
>
  <div class="lifting-workspace" id="lifting-workspace" hidden>
    <div class="lifting-toolbar">
      <div>
        <p class="lifting-kicker">Personal max tracker</p>
        <h2>Lift progress</h2>
      </div>
      <div class="lifting-toolbar-actions">
        <button id="log-set-open" class="lifting-secondary" type="button">Log set</button>
        <button id="add-lift-open" class="lifting-secondary" type="button">Add lift</button>
        <button id="lifting-lock-button" class="lifting-secondary" type="button">Lock</button>
      </div>
    </div>

    <div class="lifting-filter">
      <label for="lift-search">Search lifts</label>
      <input id="lift-search" type="search" placeholder="Bench, squat, deadlift...">
    </div>

    <div class="lifting-list" id="lifting-list"></div>

    <p id="lifting-status" class="lifting-status" role="status"></p>
  </div>

  <dialog class="lifting-modal" id="add-lift-modal">
    <form id="add-lift-form" class="lifting-form" method="dialog">
      <div class="lifting-modal-head">
        <h3>Add lift type</h3>
        <button id="add-lift-close" class="lifting-icon-button" type="button" aria-label="Close">&times;</button>
      </div>
      <label for="lift-name">Lift name</label>
      <input id="lift-name" name="name" type="text" placeholder="Incline bench press" required>
      <label for="lift-equipment-type">Equipment type</label>
      <select id="lift-equipment-type" name="equipment_type" required>
        <option value="dumbbell">Dumbbell</option>
        <option value="machine">Machine</option>
        <option value="barbell">Barbell</option>
        <option value="other" selected>Other</option>
      </select>
      <p class="lifting-form-error" id="add-lift-error" role="alert"></p>
      <button type="submit" disabled>Create lift</button>
    </form>
  </dialog>

  <dialog class="lifting-modal lifting-log-modal" id="log-set-modal">
    <form id="log-form" class="lifting-form" method="dialog">
      <div class="lifting-modal-head">
        <h3>Log a set</h3>
        <button id="log-set-close" class="lifting-icon-button" type="button" aria-label="Close">&times;</button>
      </div>
      <label for="log-date">Date</label>
      <input id="log-date" name="lifted_at" type="date" required>
      <label for="log-lift-search">Lift</label>
      <div class="lifting-lift-picker" id="log-lift-picker">
        <div class="lifting-combobox-control">
          <input id="log-lift-search" type="search" placeholder="Search or choose a lift" autocomplete="off" role="combobox" aria-controls="log-lift-options" aria-haspopup="listbox" aria-expanded="false" aria-autocomplete="list" required>
          <button class="lifting-combobox-toggle" id="log-lift-toggle" type="button" aria-label="Show lifts" aria-controls="log-lift-menu" aria-expanded="false">
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="m4 6 4 4 4-4"/></svg>
          </button>
        </div>
        <div class="lifting-combobox-menu" id="log-lift-menu" hidden>
          <div class="lifting-equipment-filters" aria-label="Filter lifts by equipment">
            <span>Equipment</span>
            <button type="button" data-log-equipment-filter="all" aria-pressed="true">All</button>
            <button type="button" data-log-equipment-filter="dumbbell" aria-pressed="false">Dumbbell</button>
            <button type="button" data-log-equipment-filter="machine" aria-pressed="false">Machine</button>
            <button type="button" data-log-equipment-filter="barbell" aria-pressed="false">Barbell</button>
            <button type="button" data-log-equipment-filter="other" aria-pressed="false">Other</button>
          </div>
          <div class="lifting-combobox-results" id="log-lift-options" role="listbox" aria-label="Lifts"></div>
        </div>
      </div>
      <input id="log-lift" name="lift_id" type="hidden" data-required-value>
      <p class="lifting-select-status" id="log-lift-search-status" role="status"></p>
      <div class="lifting-log-measurements">
        <div class="lifting-log-field">
          <label for="log-weight">Weight</label>
          <p class="lifting-equipment-note" id="log-equipment-note" hidden>
            <span class="lifting-equipment-badge" id="log-equipment-badge" aria-hidden="true"></span>
            <span id="log-equipment-instruction"></span>
          </p>
          <input id="log-weight" name="weight" type="number" min="0.5" step="0.5" placeholder="225" required>
        </div>
        <div class="lifting-log-field">
          <label for="log-reps">Reps</label>
          <input id="log-reps" name="reps" type="number" min="1" max="10" step="1" placeholder="5" required>
        </div>
      </div>
      <div class="lifting-barbell-calculator" id="barbell-calculator" hidden>
        <button class="lifting-plate-toggle" id="plate-calculator-toggle" type="button" aria-expanded="false" aria-controls="plate-calculator-panel">
          <span>Plate calculator</span>
          <span class="lifting-plate-toggle-meta"><svg class="lifting-plate-chevron" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="m4 6 4 4 4-4"/></svg></span>
        </button>
        <div class="lifting-plate-panel" id="plate-calculator-panel" aria-hidden="true" inert>
          <div class="lifting-barbell-head">
            <div>
              <span class="lifting-barbell-title">Plate calculator</span>
              <small>45 lb bar · plates per side</small>
            </div>
            <strong data-barbell-total>45 lb total</strong>
          </div>
          <div class="lifting-plate-grid">
            <div class="lifting-plate-option"><span>45 lb</span><span class="lifting-plate-stepper"><button type="button" data-plate-adjust="-1" aria-label="Remove one 45 pound plate per side">−</button><input type="number" min="0" step="1" value="0" inputmode="numeric" data-plate-weight="45" aria-label="45 pound plates per side"><button type="button" data-plate-adjust="1" aria-label="Add one 45 pound plate per side">+</button></span></div>
            <div class="lifting-plate-option"><span>25 lb</span><span class="lifting-plate-stepper"><button type="button" data-plate-adjust="-1" aria-label="Remove one 25 pound plate per side">−</button><input type="number" min="0" step="1" value="0" inputmode="numeric" data-plate-weight="25" aria-label="25 pound plates per side"><button type="button" data-plate-adjust="1" aria-label="Add one 25 pound plate per side">+</button></span></div>
            <div class="lifting-plate-option"><span>15 lb</span><span class="lifting-plate-stepper"><button type="button" data-plate-adjust="-1" aria-label="Remove one 15 pound plate per side">−</button><input type="number" min="0" step="1" value="0" inputmode="numeric" data-plate-weight="15" aria-label="15 pound plates per side"><button type="button" data-plate-adjust="1" aria-label="Add one 15 pound plate per side">+</button></span></div>
            <div class="lifting-plate-option"><span>10 lb</span><span class="lifting-plate-stepper"><button type="button" data-plate-adjust="-1" aria-label="Remove one 10 pound plate per side">−</button><input type="number" min="0" step="1" value="0" inputmode="numeric" data-plate-weight="10" aria-label="10 pound plates per side"><button type="button" data-plate-adjust="1" aria-label="Add one 10 pound plate per side">+</button></span></div>
            <div class="lifting-plate-option"><span>5 lb</span><span class="lifting-plate-stepper"><button type="button" data-plate-adjust="-1" aria-label="Remove one 5 pound plate per side">−</button><input type="number" min="0" step="1" value="0" inputmode="numeric" data-plate-weight="5" aria-label="5 pound plates per side"><button type="button" data-plate-adjust="1" aria-label="Add one 5 pound plate per side">+</button></span></div>
            <div class="lifting-plate-option"><span>2.5 lb</span><span class="lifting-plate-stepper"><button type="button" data-plate-adjust="-1" aria-label="Remove one 2.5 pound plate per side">−</button><input type="number" min="0" step="1" value="0" inputmode="numeric" data-plate-weight="2.5" aria-label="2.5 pound plates per side"><button type="button" data-plate-adjust="1" aria-label="Add one 2.5 pound plate per side">+</button></span></div>
          </div>
        </div>
      </div>
      <button type="submit" disabled>Add log</button>
    </form>
  </dialog>

  <dialog class="lifting-modal" id="rename-lift-modal">
    <form id="rename-lift-form" class="lifting-form" method="dialog">
      <div class="lifting-modal-head">
        <h3>Edit lift</h3>
        <button id="rename-lift-close" class="lifting-icon-button" type="button" aria-label="Close">&times;</button>
      </div>
      <input id="rename-lift-id" name="id" type="hidden">
      <label for="rename-lift-name">Lift name</label>
      <input id="rename-lift-name" name="name" type="text" required>
      <label for="rename-lift-equipment-type">Equipment type</label>
      <select id="rename-lift-equipment-type" name="equipment_type" required>
        <option value="dumbbell">Dumbbell</option>
        <option value="machine">Machine</option>
        <option value="barbell">Barbell</option>
        <option value="other">Other</option>
      </select>
      <button type="submit" disabled>Save lift</button>
    </form>
  </dialog>

  <dialog class="lifting-modal lifting-logs-modal" id="lift-logs-modal">
    <div class="lifting-modal-head">
      <h3 id="lift-logs-title">Logs</h3>
      <div class="lifting-modal-head-actions">
        <button class="lifting-action" id="lift-logs-delete" type="button">Delete lift</button>
        <button id="lift-logs-close" class="lifting-icon-button" type="button" aria-label="Close">&times;</button>
      </div>
    </div>
    <div id="lift-logs-content"></div>
  </dialog>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.3/dist/umd/supabase.js" defer></script>
<script src="{{ "/assets/js/personal-auth.js" | relative_url }}" defer></script>
